[project]
name = "rag-langchain"
version = "0.1.0"
description = "Minimal LangChain RAG skeleton"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0.0",
  "langgraph>=0.4.0",
  "langchain-openai>=1.0.0",
  "langchain-community>=0.3.0",
  "langchain-text-splitters>=0.3.0",
  "beautifulsoup4>=4.12.0",
  "docx2txt>=0.8",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "pypdf>=5.0.0",
  "typing_extensions>=4.15.0",
  "fastapi>=0.136.3",
  "uvicorn>=0.42.0",
  "langgraph-checkpoint-sqlite>=3.1.0",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "python-multipart>=0.0.9",
  "redis>=5.0",
  "celery>=5.4",
  "bcrypt<4.1",
]

[tool.setuptools]
py-modules = []
